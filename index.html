<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Fichas de Póker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 - Fondo oscuro estilo casino */
            color: #f8fafc; /* Slate 50 - Texto claro */
        }

        .poker-chip {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 2px 4px rgba(0,0,0,0.5);
            margin-right: 0.5rem;
            position: relative;
        }
        
        /* Decoración de borde punteado para parecer ficha real */
        .poker-chip::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px dashed rgba(0,0,0,0.4);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Estilo para los inputs dark mode */
        .input-dark {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: white;
        }
        .input-dark:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold mb-2 flex items-center justify-center gap-3 text-emerald-400">
                <i class="fa-solid fa-coins"></i> Poker Bank
            </h1>
            <p class="text-slate-400">Calculadora y Administrador de Fichas</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Panel Izquierdo: Configuración -->
            <div class="space-y-6">
                
                <!-- Configuración de Valores de Fichas -->
                <div class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                        <h2 class="text-xl font-semibold text-slate-200">
                            <i class="fa-solid fa-gear mr-2"></i> Configurar Fichas
                        </h2>
                        <button onclick="addNewChip()" class="text-sm bg-slate-700 hover:bg-slate-600 text-white py-1.5 px-3 rounded-lg flex items-center gap-1 transition-colors border border-slate-600">
                            <i class="fa-solid fa-plus"></i> Agregar
                        </button>
                    </div>
                    
                    <div class="space-y-3" id="chip-config-container">
                        <!-- El contenido se inyecta por JS -->
                    </div>
                    <button onclick="saveChipConfig()" class="w-full mt-5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar y Actualizar
                    </button>
                </div>

                <!-- Agregar Nuevo Jugador -->
                <div class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
                    <h2 class="text-xl font-semibold mb-4 border-b border-slate-700 pb-2 text-slate-200">
                        <i class="fa-solid fa-user-plus mr-2"></i> Nuevo Jugador
                    </h2>
                    
                    <form id="add-player-form" onsubmit="addPlayer(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Nombre</label>
                            <input type="text" id="new-player-name" required placeholder="Ej: Juan" class="input-dark w-full px-4 py-2 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Dinero ($)</label>
                            <input type="number" id="new-player-money" required placeholder="Ej: 500" min="1" step="any" class="input-dark w-full px-4 py-2 rounded-lg">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200 flex justify-center items-center gap-2">
                            <i class="fa-solid fa-plus"></i> Ingresar Jugador
                        </button>
                    </form>
                </div>
                
                <!-- Resumen Total -->
                <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl p-6 shadow-xl border border-slate-700">
                     <h2 class="text-xl font-semibold mb-4 text-slate-200">Resumen de la Mesa</h2>
                     <div class="space-y-3">
                         <div class="flex justify-between items-center bg-slate-800/50 p-3 rounded-lg">
                             <span class="text-slate-400">Total en Pozo:</span>
                             <span id="total-money" class="text-2xl font-bold text-emerald-400">$0.00</span>
                         </div>
                         <div class="flex justify-between items-center bg-slate-800/50 p-3 rounded-lg">
                             <span class="text-slate-400">Total Fichas:</span>
                             <span id="total-chips" class="text-xl font-bold text-blue-400">0</span>
                         </div>
                     </div>
                </div>

            </div>

            <!-- Panel Derecho: Lista de Jugadores -->
            <div class="lg:col-span-2">
                <div class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700 min-h-full">
                    <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <h2 class="text-2xl font-semibold text-slate-200">
                            <i class="fa-solid fa-users mr-2"></i> Jugadores en Mesa (<span id="player-count">0</span>)
                        </h2>
                        <button onclick="clearAllPlayers()" class="text-red-400 hover:text-red-300 text-sm flex items-center gap-1 transition-colors">
                            <i class="fa-solid fa-trash-can"></i> Limpiar Mesa
                        </button>
                    </div>

                    <!-- Contenedor donde se inyectarán las tarjetas de los jugadores -->
                    <div id="players-container" class="space-y-4">
                        <!-- Mensaje de estado vacío -->
                        <div id="empty-state" class="text-center py-12 text-slate-500">
                            <i class="fa-solid fa-hands-holding-circle text-6xl mb-4 opacity-50"></i>
                            <p class="text-lg">No hay jugadores en la mesa.</p>
                            <p class="text-sm mt-2">Agrega jugadores usando el panel izquierdo.</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let chipsConfig = [];
        let players = [];

        // Intentar cargar los datos guardados en la memoria del navegador
        try {
            const savedChips = localStorage.getItem('pokerBank_chips');
            const savedPlayers = localStorage.getItem('pokerBank_players');

            if (savedChips) {
                chipsConfig = JSON.parse(savedChips);
            } else {
                // Valores por defecto si es la primera vez que entra
                chipsConfig = [
                    { id: 'chip_gray', name: 'Grises', color: '#94a3b8', value: 10 },
                    { id: 'chip_red', name: 'Rojas', color: '#ef4444', value: 50 },
                    { id: 'chip_blue', name: 'Azules', color: '#3b82f6', value: 100 },
                    { id: 'chip_green', name: 'Verdes', color: '#10b981', value: 250 },
                    { id: 'chip_black', name: 'Negras', color: '#334155', value: 1000 }
                ];
            }

            if (savedPlayers) {
                players = JSON.parse(savedPlayers);
            }
        } catch (error) {
            console.error("Error cargando el guardado:", error);
            players = [];
        }

        // Función central para guardar en la memoria
        function saveData() {
            localStorage.setItem('pokerBank_chips', JSON.stringify(chipsConfig));
            localStorage.setItem('pokerBank_players', JSON.stringify(players));
        }

        // Elementos del DOM
        const playersContainer = document.getElementById('players-container');
        const emptyState = document.getElementById('empty-state');
        const totalMoneyEl = document.getElementById('total-money');
        const totalChipsEl = document.getElementById('total-chips');
        const playerCountEl = document.getElementById('player-count');

        // Calcula el contraste para que el texto de la ficha siempre sea legible (blanco o negro)
        function getContrast(hexcolor) {
            if(!hexcolor) return 'white';
            hexcolor = hexcolor.replace("#", "");
            if (hexcolor.length === 3) hexcolor = hexcolor.split('').map(c => c+c).join('');
            let r = parseInt(hexcolor.substr(0,2),16);
            let g = parseInt(hexcolor.substr(2,2),16);
            let b = parseInt(hexcolor.substr(4,2),16);
            let yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? '#0f172a' : 'white';
        }

        function renderChipConfig() {
            const container = document.getElementById('chip-config-container');
            container.innerHTML = '';
            
            // Colores predefinidos solicitados
            const allowedColors = [
                { name: 'Gris', hex: '#94a3b8' },
                { name: 'Negro', hex: '#334155' },
                { name: 'Azul', hex: '#3b82f6' },
                { name: 'Amarillo', hex: '#eab308' },
                { name: 'Rojo', hex: '#ef4444' },
                { name: 'Verde', hex: '#10b981' }
            ];
            
            chipsConfig.forEach(chip => {
                let optionsHTML = '';
                allowedColors.forEach(c => {
                    optionsHTML += `<option value="${c.hex}" ${chip.color === c.hex ? 'selected' : ''}>${c.name}</option>`;
                });

                const div = document.createElement('div');
                div.className = 'flex items-center gap-2 bg-slate-900/50 p-2 rounded-lg border border-slate-700 transition-colors focus-within:border-slate-500 shadow-sm';
                div.innerHTML = `
                    <div id="preview_${chip.id}" class="w-6 h-6 rounded-full overflow-hidden shrink-0 border border-slate-400 shadow-sm" style="background-color: ${chip.color}"></div>
                    <select id="color_${chip.id}" onchange="document.getElementById('preview_${chip.id}').style.backgroundColor = this.value" class="input-dark px-1 py-1.5 rounded text-xs shrink-0 cursor-pointer w-[75px]">
                        ${optionsHTML}
                    </select>
                    <input type="text" id="name_${chip.id}" value="${chip.name}" class="input-dark flex-1 px-2 py-1.5 rounded text-sm w-full min-w-0" placeholder="Nombre (ej: Roja)">
                    <div class="flex items-center gap-1 shrink-0 bg-slate-800 rounded px-1 border border-slate-600">
                        <span class="text-slate-400 font-medium pl-1">$</span>
                        <input type="number" id="val_${chip.id}" value="${chip.value}" class="input-dark w-16 md:w-20 px-2 py-1 rounded text-right text-sm border-0 focus:ring-0" min="0.1" step="any">
                    </div>
                    <button onclick="removeChip('${chip.id}')" class="text-slate-500 hover:text-red-400 px-1 transition-colors shrink-0" title="Eliminar Ficha">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function addNewChip() {
            const newId = 'chip_' + Date.now();
            chipsConfig.push({
                id: newId,
                name: 'Nueva',
                color: '#eab308', // Amarillo por defecto para las nuevas
                value: 5000
            });
            renderChipConfig();
        }

        function removeChip(id) {
            if (chipsConfig.length <= 1) {
                alert("La mesa debe tener al menos un tipo de ficha configurada.");
                return;
            }
            chipsConfig = chipsConfig.filter(c => c.id !== id);
            saveData();
            renderChipConfig();
        }

        function saveChipConfig() {
            let newConfig = [];
            let hasError = false;
            
            chipsConfig.forEach(chip => {
                const colorInput = document.getElementById(`color_${chip.id}`);
                const nameInput = document.getElementById(`name_${chip.id}`);
                const valInput = document.getElementById(`val_${chip.id}`);
                
                if (!colorInput || !nameInput || !valInput) return;
                
                let valVal = parseFloat(valInput.value);
                let nameVal = nameInput.value.trim();
                
                if (!nameVal || isNaN(valVal) || valVal <= 0) {
                    hasError = true;
                }
                
                newConfig.push({
                    id: chip.id,
                    name: nameVal || 'Ficha',
                    color: colorInput.value,
                    value: valVal
                });
            });

            if (hasError) {
                alert("Por favor revisa los datos: los nombres no pueden estar vacíos y los valores deben ser mayores a 0.");
                return;
            }

            chipsConfig = newConfig;
            
            // Recalcular todo el estado de los jugadores con la nueva estructura de fichas
            players.forEach(player => {
                player.chips = calculateChips(player.money); // Recalcular entrada
                
                // Mantener registro de retiro actual, adaptándolo a la nueva configuración
                const newChipsOut = {};
                chipsConfig.forEach(c => {
                    newChipsOut[c.id] = player.chipsOut[c.id] || 0;
                });
                player.chipsOut = newChipsOut;
            });
            
            saveData();
            renderPlayers();
            updateSummary();
            
            // Feedback visual en el botón
            const btn = document.querySelector('button[onclick="saveChipConfig()"]');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> ¡Mesa Actualizada!';
            btn.classList.replace('bg-emerald-600', 'bg-emerald-400');
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('bg-emerald-400', 'bg-emerald-600');
            }, 1500);
        }

        function calculateChips(amount) {
            let remaining = amount;
            let result = {};
            chipsConfig.forEach(c => result[c.id] = 0);

            if (chipsConfig.length === 0) return result;

            // Ordenamos por valor (menor a mayor) para las bases iniciales
            let sortedAsc = [...chipsConfig].sort((a, b) => a.value - b.value);
            
            // Intentamos dar un bloque inicial de fichas bajas (10 de las tres más chicas, 4 de la cuarta)
            const baseTargets = [10, 10, 10, 4];
            
            for (let i = 0; i < sortedAsc.length; i++) {
                let chip = sortedAsc[i];
                let target = baseTargets[i] || 0;
                
                if (target > 0) {
                    let cost = target * chip.value;
                    if (remaining >= cost) {
                        result[chip.id] = target;
                        remaining = parseFloat((remaining - cost).toFixed(2));
                    } else if (remaining >= chip.value) {
                        let max = Math.floor(remaining / chip.value);
                        result[chip.id] = max;
                        remaining = parseFloat((remaining - (max * chip.value)).toFixed(2));
                    }
                }
            }

            // El saldo remanente se cubre con las fichas de mayor valor (orden descendente)
            let sortedDesc = [...chipsConfig].sort((a, b) => b.value - a.value);
            for (let chip of sortedDesc) {
                if (remaining >= chip.value) {
                    const count = Math.floor(remaining / chip.value);
                    result[chip.id] += count;
                    remaining = parseFloat((remaining - (count * chip.value)).toFixed(2));
                }
            }

            return result;
        }

        function addPlayer(event) {
            event.preventDefault();
            const nameInput = document.getElementById('new-player-name');
            const moneyInput = document.getElementById('new-player-money');
            const name = nameInput.value.trim();
            const money = parseFloat(moneyInput.value);

            if (name === '' || isNaN(money) || money <= 0) return;

            const initialChipsOut = {};
            chipsConfig.forEach(c => initialChipsOut[c.id] = 0);

            const newPlayer = {
                id: 'player_' + Date.now(),
                name: name,
                money: money,
                chips: calculateChips(money),
                chipsOut: initialChipsOut
            };

            players.push(newPlayer);
            
            nameInput.value = '';
            moneyInput.value = '';
            nameInput.focus();

            saveData();
            renderPlayers();
            updateSummary();
        }

        function removePlayer(id) {
            players = players.filter(player => player.id !== id);
            saveData();
            renderPlayers();
            updateSummary();
        }

        function clearAllPlayers() {
            if(players.length === 0) return;
            if (confirm('¿Estás seguro de que quieres limpiar la mesa y eliminar a todos los jugadores?')) {
                players = [];
                saveData();
                renderPlayers();
                updateSummary();
            }
        }

        function updateCashOut(playerId, chipId, val) {
            const player = players.find(p => p.id === playerId);
            if (!player) return;
            
            let num = parseInt(val);
            if (isNaN(num) || num < 0) num = 0;
            
            player.chipsOut[chipId] = num;
            
            // Calcular pago total
            let payout = 0;
            chipsConfig.forEach(c => {
                payout += (player.chipsOut[c.id] || 0) * c.value;
            });
                           
            const balance = payout - player.money;
            
            // Actualizar DOM del jugador
            document.getElementById(`payout-${playerId}`).innerText = `$${payout.toFixed(2)}`;
            const balanceEl = document.getElementById(`balance-${playerId}`);
            
            if (balance > 0) {
                balanceEl.innerText = `Balance: +$${balance.toFixed(2)} (Ganancia)`;
                balanceEl.className = "text-sm font-bold text-green-400 mt-1 block";
            } else if (balance < 0) {
                balanceEl.innerText = `Balance: -$${Math.abs(balance).toFixed(2)} (Pérdida)`;
                balanceEl.className = "text-sm font-bold text-red-400 mt-1 block";
            } else {
                balanceEl.innerText = `Balance: $0.00 (Empate)`;
                balanceEl.className = "text-sm font-bold text-slate-400 mt-1 block";
            }
            
            saveData();
        }

        function updateSummary() {
            let totalMoney = 0;
            let totalChips = 0;

            players.forEach(p => {
                totalMoney += p.money;
                chipsConfig.forEach(c => {
                    totalChips += (p.chips[c.id] || 0);
                });
            });

            totalMoneyEl.innerText = `$${totalMoney.toFixed(2)}`;
            totalChipsEl.innerText = totalChips;
            playerCountEl.innerText = players.length;
        }

        function renderPlayers() {
            playersContainer.innerHTML = '';

            if (players.length === 0) {
                playersContainer.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            players.forEach(player => {
                let playerTotalChips = 0;
                chipsConfig.forEach(c => playerTotalChips += (player.chips[c.id] || 0));
                
                let payout = 0;
                chipsConfig.forEach(c => payout += (player.chipsOut[c.id] || 0) * c.value);
                const balance = payout - player.money;

                // Generar etiquetas de la distribución de fichas sugerida
                let initialChipsHTML = '';
                chipsConfig.forEach(chip => {
                    if (player.chips[chip.id] > 0) {
                        initialChipsHTML += `
                            <div class="bg-slate-800 text-xs px-2 py-1.5 rounded border border-slate-700 flex items-center gap-1.5 shadow-sm">
                                <span class="w-3.5 h-3.5 rounded-full border border-slate-400 shadow-inner" style="background-color: ${chip.color};"></span> 
                                <span class="font-medium text-slate-200">${player.chips[chip.id]}</span>
                            </div>
                        `;
                    }
                });

                // Generar los inputs de retiro dinámicamente
                let cashOutGridHTML = '';
                chipsConfig.forEach(chip => {
                    let contrast = getContrast(chip.color);
                    let displayVal = chip.value >= 1000 ? (chip.value/1000)+'k' : chip.value;
                    cashOutGridHTML += `
                        <div class="text-center flex flex-col items-center">
                            <div class="poker-chip mx-auto mb-2 transform scale-90 flex items-center justify-center font-bold text-[10px]" style="background-color: ${chip.color}; border: 1px solid rgba(0,0,0,0.4); color: ${contrast}; text-shadow: ${contrast === 'white' ? '0px 1px 2px rgba(0,0,0,0.6)' : 'none'};">
                                ${displayVal}
                            </div>
                            <input type="number" min="0" value="${player.chipsOut[chip.id] === 0 ? '' : player.chipsOut[chip.id]}" placeholder="0" oninput="updateCashOut('${player.id}', '${chip.id}', this.value)" class="input-dark w-14 px-1 py-1 rounded text-center text-sm font-semibold shadow-inner">
                        </div>
                    `;
                });

                const playerCard = document.createElement('div');
                playerCard.className = 'bg-slate-700/50 rounded-xl p-5 border border-slate-600 transition-all hover:border-slate-500 shadow-lg';
                
                playerCard.innerHTML = `
                    <div class="flex justify-between items-start mb-4 border-b border-slate-600/50 pb-3">
                        <div>
                            <h3 class="text-xl font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-user-astronaut text-slate-400"></i> ${player.name}
                            </h3>
                            <p class="text-emerald-400 font-semibold mt-1 bg-slate-800/50 inline-block px-2 py-0.5 rounded">
                                Buy-in: $${player.money.toFixed(2)}
                            </p>
                        </div>
                        <button onclick="removePlayer('${player.id}')" class="text-slate-400 hover:text-red-400 transition-colors p-2 bg-slate-800 hover:bg-slate-700 rounded" title="Eliminar Jugador">
                            <i class="fa-solid fa-xmark text-lg"></i>
                        </button>
                    </div>
                    
                    <div>
                        <p class="text-sm text-slate-400 mb-2 flex items-center justify-between">
                            <span>Distribución Inicial Sugerida:</span>
                            <span class="bg-slate-800 px-2 py-1 rounded text-xs font-bold text-blue-300 border border-slate-700 shadow-inner">${playerTotalChips} fichas en total</span>
                        </p>
                        <div class="flex flex-wrap gap-2 mb-4">
                            ${initialChipsHTML}
                        </div>
                    </div>

                    <div class="bg-slate-800/90 rounded-lg p-4 mt-4 border border-slate-600 shadow-inner">
                        <h4 class="text-white font-medium mb-4 border-b border-slate-700 pb-2 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-coins text-yellow-500"></i> Finalizar Partida (Contar fichas físicas)
                        </h4>
                        
                        <!-- La grilla se adapta sola según cuántas fichas configures (auto-fill) -->
                        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-y-4 gap-x-2 mb-4 justify-items-center">
                            ${cashOutGridHTML}
                        </div>

                        <div class="bg-slate-900 rounded-lg p-3 flex justify-between items-center border border-slate-700 shadow-sm mt-2">
                            <span class="text-slate-400 text-sm font-medium">Equivalente en Plata:</span>
                            <span id="payout-${player.id}" class="text-xl font-bold text-yellow-400">$${payout.toFixed(2)}</span>
                        </div>
                        <div class="text-right mt-2">
                            <span id="balance-${player.id}" class="text-sm font-bold ${balance > 0 ? 'text-green-400' : balance < 0 ? 'text-red-400' : 'text-slate-400'} mt-1 block bg-slate-900 inline-block px-3 py-1 rounded border border-slate-800">
                                Balance: ${balance > 0 ? '+' : ''}$${balance.toFixed(2)} ${balance > 0 ? '(Ganancia)' : balance < 0 ? '(Pérdida)' : '(Empate)'}
                            </span>
                        </div>
                    </div>
                `;
                
                playersContainer.appendChild(playerCard);
            });
        }

        renderChipConfig();
        updateSummary();
    </script>
</body>
</html>
